<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6F00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#ECEFF1"/>
      <stop offset="50%" stop-color="#CFD8DC"/>
      <stop offset="75%" stop-color="#B0BEC5"/>
      <stop offset="100%" stop-color="#90A4AE"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle glow circle -->
  <circle cx="256" cy="240" r="180" fill="#FFFFFF" fill-opacity="0.12"/>

  <!-- Tiffin Carrier Container with shadow -->
  <g filter="url(#shadow)">
    <!-- Carrier Handle Top -->
    <path d="M 196 110 C 196 74, 316 74, 316 110 L 316 142 L 196 142 Z" fill="#CFD8DC" stroke="#78909C" stroke-width="8" stroke-linejoin="round"/>
    <!-- Handle bar arch -->
    <path d="M 220 110 C 220 90, 292 90, 292 110" fill="none" stroke="#ECEFF1" stroke-width="12" stroke-linecap="round"/>

    <!-- Side Brackets linking tiers -->
    <rect x="172" y="136" width="16" height="236" rx="8" fill="#B0BEC5" stroke="#78909C" stroke-width="4"/>
    <rect x="324" y="136" width="16" height="236" rx="8" fill="#B0BEC5" stroke="#78909C" stroke-width="4"/>

    <!-- Tiffin Tier 1 (Top) -->
    <rect x="176" y="146" width="160" height="66" rx="18" fill="url(#metalGrad)" stroke="#78909C" stroke-width="4"/>
    <rect x="190" y="174" width="132" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.6"/>

    <!-- Tiffin Tier 2 (Middle) -->
    <rect x="176" y="222" width="160" height="66" rx="18" fill="url(#metalGrad)" stroke="#78909C" stroke-width="4"/>
    <rect x="190" y="250" width="132" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.6"/>

    <!-- Tiffin Tier 3 (Bottom) -->
    <rect x="176" y="298" width="160" height="66" rx="18" fill="url(#metalGrad)" stroke="#78909C" stroke-width="4"/>
    <rect x="190" y="326" width="132" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.6"/>

    <!-- Steam swirls from top -->
    <path d="M 236 78 Q 230 60 238 48 Q 246 36 240 26" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8"/>
    <path d="M 272 74 Q 266 56 274 44 Q 282 32 276 22" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8"/>
  </g>

  <!-- App Label Pill -->
  <g transform="translate(106, 396)">
    <rect width="300" height="68" rx="34" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="150" y="44" font-family="'Baloo 2', 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" fill="#E65100" text-anchor="middle" letter-spacing="1">ASAN TIFFIN</text>
  </g>
</svg>
